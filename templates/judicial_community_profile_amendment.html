<!DOCTYPE html>
<html lang="__HTML_LANG__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  __SITE_FAVICON__
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>__JUD_COMMUNITY_PROFILE_TITLE__</title>
  <link rel="stylesheet" href="/static/css/brand.css">
</head>
<body class="app-shell-body app-shell-body--viewport-lock">
  <div class="app-shell" data-needs-profile="0" data-self-private-handle="__HOME_SELF_PRIVATE_HANDLE__" data-connection-count="__HOME_CONNECTION_COUNT__">
    __SECURED_TOPBAR__
    __HOME_RAIL_HTML__
    <div class="__HOME_APP_STAGE_CLASS__">
      <main class="app-main" id="app-main">
        <div id="app-home-feed-panel" class="app-cards judicial-post-case-panel">
          __JUD_COMMUNITY_CONTEXT_CARD__
          __JUD_COMMUNITY_PROFILE_FORM_CARD__
        </div>
      </main>
    </div>
  </div>
  __SECURED_PUBLIC_FOOTER__
  <script type="application/json" id="home-shell-i18n">__HOME_SHELL_I18N_JSON__</script>
  <script src="/static/js/smiley-blink.js" defer></script>
  <script>
    (function () {
      var form = document.getElementById("judicial-community-profile-amendment-form");
      if (!form) return;
      var descEditor = document.getElementById("judicial-profile-description-editor");
      var descSink = document.getElementById("judicial-profile-description-input");
      var intEditor = document.getElementById("judicial-profile-intention-editor");
      var intSink = document.getElementById("judicial-profile-intention-input");
      var rationaleEditor = document.getElementById("judicial-profile-rationale-editor");
      var rationaleSink = document.getElementById("judicial-profile-rationale-input");
      var changeErr = document.getElementById("judicial-profile-change-error");
      var rationaleErr = document.getElementById("judicial-profile-rationale-error");
      function plainFromHtml(html) {
        var tmp = document.createElement("div");
        tmp.innerHTML = String(html || "");
        return (tmp.textContent || tmp.innerText || "").trim();
      }
      function bindToolbar(toolbar, editor) {
        if (!toolbar || !editor) return;
        toolbar.querySelectorAll("[data-editor-cmd]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var cmd = btn.getAttribute("data-editor-cmd");
            if (!cmd) return;
            editor.focus();
            document.execCommand(cmd, false, null);
          });
        });
      }
      bindToolbar(form.querySelector("[data-toolbar=description]"), descEditor);
      bindToolbar(form.querySelector("[data-toolbar=intention]"), intEditor);
      bindToolbar(form.querySelector("[data-toolbar=rationale]"), rationaleEditor);
      form.addEventListener("submit", function (e) {
        var descPlain = "";
        var intPlain = "";
        if (descEditor && descSink) {
          var descHtml = descEditor.innerHTML || "";
          descPlain =
            String(descEditor.innerText != null ? descEditor.innerText : "")
              .replace(/\u00a0/g, " ")
              .trim() || plainFromHtml(descHtml);
          descSink.value = descHtml;
        }
        if (intEditor && intSink) {
          var intHtml = intEditor.innerHTML || "";
          intPlain =
            String(intEditor.innerText != null ? intEditor.innerText : "")
              .replace(/\u00a0/g, " ")
              .trim() || plainFromHtml(intHtml);
          intSink.value = intHtml;
        }
        var joinSel = form.querySelector('[name="join_policy"]');
        var joinVal = joinSel ? String(joinSel.value || "").trim() : "";
        if (!descPlain && !intPlain && !joinVal) {
          e.preventDefault();
          if (changeErr) {
            changeErr.hidden = false;
            changeErr.removeAttribute("hidden");
          }
          return;
        }
        if (changeErr) {
          changeErr.hidden = true;
          changeErr.setAttribute("hidden", "hidden");
        }
        if (!rationaleEditor || !rationaleSink) {
          e.preventDefault();
          return;
        }
        var rationaleHtml = rationaleEditor.innerHTML || "";
        var rationalePlain =
          String(rationaleEditor.innerText != null ? rationaleEditor.innerText : "")
            .replace(/\u00a0/g, " ")
            .trim() || plainFromHtml(rationaleHtml);
        if (!rationalePlain) {
          e.preventDefault();
          if (rationaleErr) {
            rationaleErr.hidden = false;
            rationaleErr.removeAttribute("hidden");
          }
          return;
        }
        if (rationaleErr) {
          rationaleErr.hidden = true;
          rationaleErr.setAttribute("hidden", "hidden");
        }
        rationaleSink.value = rationaleHtml;
      });
    })();
  </script>
</body>
</html>
