<!DOCTYPE html>
<html lang="__HTML_LANG__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  __SITE_FAVICON__
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>__JUD_POST_APPEAL_TITLE__</title>
  <link rel="stylesheet" href="/static/css/brand.css">
</head>
<body class="app-shell-body app-shell-body--viewport-lock">
  <div class="app-shell" data-needs-profile="0" data-self-private-handle="__HOME_SELF_PRIVATE_HANDLE__" data-connection-count="__HOME_CONNECTION_COUNT__">
    __SECURED_TOPBAR__
    __HOME_RAIL_HTML__
    <div class="__HOME_APP_STAGE_CLASS__">
      <main class="app-main" id="app-main">
        <div id="app-home-feed-panel" class="app-cards judicial-post-case-panel">
          __JUD_POST_CASE_POST_CARD__
          __JUD_POST_APPEAL_FORM_CARD__
        </div>
      </main>
    </div>
  </div>
  __SECURED_PUBLIC_FOOTER__
  <script type="application/json" id="home-shell-i18n">__HOME_SHELL_I18N_JSON__</script>
  <script src="/static/js/smiley-blink.js" defer></script>
  <script>
    (function () {
      var form = document.getElementById("judicial-appeal-form");
      if (!form) return;
      var editor = document.getElementById("judicial-appeal-rationale-editor");
      var sink = document.getElementById("judicial-appeal-rationale-input");
      var err = document.getElementById("judicial-appeal-rationale-error");
      function plainFromHtml(html) {
        var tmp = document.createElement("div");
        tmp.innerHTML = String(html || "");
        return (tmp.textContent || tmp.innerText || "").trim();
      }
      form.querySelectorAll("[data-editor-cmd]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cmd = btn.getAttribute("data-editor-cmd");
          if (!cmd) return;
          editor && editor.focus();
          document.execCommand(cmd, false, null);
        });
      });
      form.addEventListener("submit", function (e) {
        if (!editor || !sink) return;
        try {
          if (document.activeElement === editor) {
            editor.blur();
          }
        } catch (_x) {}
        var html = editor.innerHTML || "";
        var plainText =
          String(editor.innerText != null ? editor.innerText : "")
            .replace(/\u00a0/g, " ")
            .trim() || plainFromHtml(html);
        if (!plainText) {
          e.preventDefault();
          if (err) {
            err.hidden = false;
            err.removeAttribute("hidden");
            try {
              err.scrollIntoView({ block: "nearest", behavior: "smooth" });
            } catch (_s) {}
          }
          return;
        }
        if (err) {
          err.hidden = true;
          err.setAttribute("hidden", "hidden");
        }
        sink.value = html;
      });
    })();
  </script>
</body>
</html>
