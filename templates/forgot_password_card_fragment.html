<section class="card auth-card card--action" data-auth-card="forgot">
  <div class="card-accent" role="presentation"></div>
  <h1>@@ui.login.forgot_card_heading@@</h1>
  <p class="sub">@@ui.login.forgot_card_subtitle@@</p>
  <form id="forgot-form" dir="ltr" autocomplete="on">
    <label for="forgot-email">@@ui.shared.email_label@@</label>
    <input id="forgot-email" name="email" type="email" required autocomplete="username" dir="ltr" inputmode="email" spellcheck="false">
    <button type="submit" id="forgot-submit" class="btn-cta">@@ui.login.forgot_submit@@</button>
  </form>
  <p class="err" id="forgot-msg" role="alert"></p>
  <p class="auth-flow-back">
    <button type="button" class="auth-text-btn" id="auth-back-from-forgot">@@ui.login.back_to_login@@</button>
  </p>
</section>
