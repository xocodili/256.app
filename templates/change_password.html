<!DOCTYPE html>
<html lang="__HTML_LANG__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  __SITE_FAVICON__
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  __CSRF_META__
  <title>@@ui.login.reset_password_page_title@@</title>
  <link rel="stylesheet" href="/static/css/brand.css">
</head>
<body class="app-shell-body app-shell-body--viewport-lock">
  <div class="app-shell app-shell--guest">
    __PUBLIC_TOPBAR__
    <main class="guest-split guest-split--single">
      <section class="card auth-card guest-login-card card--action">
        <div class="card-accent" role="presentation"></div>
        __CHANGE_PASSWORD_PANEL__
      </section>
    </main>
  </div>
  <script type="application/json" id="change-password-i18n">__CHANGE_PASSWORD_I18N_JSON__</script>
  <script src="/static/js/profile-account.js" defer></script>
  <script>
    (function () {
      var UI = JSON.parse(document.getElementById('change-password-i18n').textContent);
      function csrfToken() {
        var meta = document.querySelector('meta[name="csrf-token"]');
        return meta ? meta.getAttribute('content') : '';
      }
      window.ProfileCard = {
        mutationHeaders: function (extra) {
          var h = { Accept: 'application/json', 'X-CSRF-Token': csrfToken() };
          if (extra) {
            for (var k in extra) {
              if (Object.prototype.hasOwnProperty.call(extra, k)) h[k] = extra[k];
            }
          }
          return h;
        }
      };
      document.addEventListener('DOMContentLoaded', function () {
        var block = document.getElementById('profile-change-password-block');
        if (!block || !window.ProfileAccount) return;
        window.ProfileAccount.bind({
          block: block,
          passwordBlock: block,
          passwordVerifyStep: document.getElementById('profile-change-password-step-verify'),
          passwordNewStep: document.getElementById('profile-change-password-step-new'),
          passwordMsg: document.getElementById('profile-change-password-msg'),
          UI: UI,
          notify: function () {}
        });
      });
    })();
  </script>
</body>
</html>
