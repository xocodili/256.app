[package]
name = "app"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
default-run = "app"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
axum-extra = { version = "0.10", features = ["cookie"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.36", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
hmac = "0.12"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
governor = { version = "0.10", default-features = false, features = ["std", "dashmap"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder"] }
sqlx = { version = "0.8", features = ["chrono", "json", "macros", "migrate", "mysql", "runtime-tokio", "rust_decimal"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum", "tracing"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
jsonwebtoken = "9"
psl = "2.1.203"
ammonia = "4.0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
rand = "0.8"
# `util` enables `ServiceExt::oneshot`, used by the in-process API-contract harness
# (tests/common/api.rs) to drive the real router without binding a TCP socket.
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
