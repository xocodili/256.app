<section class="card auth-card card--action" data-auth-card="reactivate">
  <div class="card-accent" role="presentation"></div>
  <h1>@@ui.login.reactivate_card_heading@@</h1>
  <p class="sub">@@ui.login.reactivate_card_subtitle@@</p>
  <form id="reactivate-form" dir="ltr" autocomplete="on">
    <label for="reactivate-email">@@ui.shared.email_label@@</label>
    <input id="reactivate-email" name="email" type="email" required autocomplete="username" dir="ltr" inputmode="email" spellcheck="false">
    <button type="submit" id="reactivate-submit" class="btn-cta">@@ui.login.reactivate_submit@@</button>
  </form>
  <p class="err" id="reactivate-msg" role="alert"></p>
  <p class="auth-flow-back">
    <button type="button" class="auth-text-btn" id="auth-back-from-reactivate">@@ui.login.back_to_login@@</button>
  </p>
</section>
